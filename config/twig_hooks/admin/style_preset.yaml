sylius_twig_hooks:
    hooks:
        'sylius_admin.style_preset.create.content':
            form:
                template: '@VanssaSyliusSliderPlugin/admin/shared/form/form.html.twig'
                configuration:
                    render_rest: false
                priority: 100

        'sylius_admin.style_preset.update.content':
            form:
                template: '@VanssaSyliusSliderPlugin/admin/shared/form/form.html.twig'
                configuration:
                    render_rest: false
                priority: 100

        'sylius_admin.style_preset.create.content.form':
            sections:
                enabled: false
            content:
                template: '@VanssaSyliusSliderPlugin/admin/shared/form/content.html.twig'
                priority: 0

        'sylius_admin.style_preset.update.content.form':
            sections:
                enabled: false
            content:
                template: '@VanssaSyliusSliderPlugin/admin/shared/form/content.html.twig'
                priority: 0

        'sylius_admin.style_preset.create.content.form.sections.general':
            default:
                enabled: false

        'sylius_admin.style_preset.update.content.form.sections.general':
            default:
                enabled: false

        'sylius_admin.style_preset.create.content.form.content':
            sections:
                template: '@VanssaSyliusSliderPlugin/admin/style_preset/form/sections.html.twig'
                priority: 0

        'sylius_admin.style_preset.update.content.form.content':
            sections:
                template: '@VanssaSyliusSliderPlugin/admin/style_preset/form/sections.html.twig'
                priority: 0
