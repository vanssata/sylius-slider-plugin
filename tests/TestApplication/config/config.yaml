# yaml-language-server: $schema=../../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
imports:
    - { resource: "@VanssaSyliusSliderPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Vanssa\SyliusSliderPlugin

when@prod:
    doctrine:
        orm:
            metadata_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

when@dev:
    # The test application's own monolog.yaml logs every channel at debug level
    # into a single never-rotated file. Measured on a 100 MB sample of a grown
    # var/log/dev.log: doctrine accounted for 74.5% of the bytes and event for
    # 17.7% — together 92% — which is how that file reached 709 MB.
    #
    # Both channels stay fully visible in the web profiler (the Doctrine and
    # Events panels collect independently of monolog handlers), so dropping
    # them from the *file* costs nothing in practice while keeping request,
    # security, php and error entries greppable. Rotation caps the rest.
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 3
                channels: ['!doctrine', '!event']
sylius_twig_hooks:
    hooks:
        'sylius_shop.homepage.index':
            banner:
                enabled: false
            vanssa_sylius_slider_homepage:
                component: 'vanssa_sylius_slider:shop:homepage_slider'
                props:
                    code: 'fashion-classic-arrows'
                priority: 400
