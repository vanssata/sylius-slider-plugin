services:
    php:
        build:
            args:
                PHP_IMAGE: ghcr.io/sylius/sylius-php:8.3-fixuid-xdebug-alpine
                PHP_RUNTIME_USER: "sylius:sylius"
        user: ${DOCKER_USER:-1000:1000}
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            # You can move these environment variables to your .env.local file
            APP_ENV: ${ENV:-prod}
            APP_SECRET: EDITME
            DATABASE_URL: "mysql://root@mysql/sylius_%kernel.environment%"
            MAILER_DSN: smtp://mailhog:1025
            MESSENGER_TRANSPORT_DSN: doctrine://default
            SYLIUS_MESSENGER_TRANSPORT_MAIN_DSN: doctrine://default
            SYLIUS_MESSENGER_TRANSPORT_MAIN_FAILED_DSN: doctrine://default?queue_name=main_failed
            SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_DSN: doctrine://default?queue_name=catalog_promotion_removal
            SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_FAILED_DSN: doctrine://default?queue_name=catalog_promotion_removal_failed
            SYLIUS_MESSENGER_TRANSPORT_PAYMENT_REQUEST_DSN: sync://
            SYLIUS_MESSENGER_TRANSPORT_PAYMENT_REQUEST_FAILED_DSN: sync://
            PHP_DATE_TIMEZONE: ${PHP_DATE_TIMEZONE:-UTC}
            XDEBUG_MODE: debug
            XDEBUG_CONFIG: >-
                client_host=host.docker.internal
                client_port=9003
            # This should correspond to the server declared in PHPStorm `Preferences | Languages & Frameworks | PHP | Servers`
            # Then PHPStorm will use the corresponding path mappings
            PHP_IDE_CONFIG: serverName=sylius
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
          - .:/srv/sylius:rw,cached
          # if you develop on Linux, you may use a bind-mounted host directory instead
#          - ./var:/srv/sylius/var:rw
          - ./public:/srv/sylius/public:rw,delegated
          # if you develop on Linux, you may use a bind-mounted host directory instead
#          - ./public/media:/srv/sylius/public/media:rw
          - public-media:/srv/sylius/public/media:rw
    mysql:
        volumes:
            - mysql-data:/var/lib/mysql:rw
        ports:
            - "3306:3306"
    nginx:
        environment:
            WORKING_DIR: /srv/sylius/vendor/sylius/test-application
        volumes:
            - .:/srv/sylius:ro
            # if you develop on Linux, you may use a bind-mounted host directory instead
#            - ./public/media:/srv/sylius/public/media:ro
        ports:
            - "80:80"
    nodejs:
        image: node:${NODE_VERSION:-20}-alpine
        user: ${DOCKER_USER:-1000:1000}
        working_dir: /srv/sylius
        entrypoint: [ "/bin/sh","-c" ]
        command:
            - |
                cd vendor/sylius/test-application
                yarn install
                yarn build
        volumes:
            - .:/srv/sylius:rw,cached
            - ./public:/srv/sylius/public:rw,delegated
    nodejs-watch:
        # Long-lived `encore dev --watch`. Gated behind the "watch" profile so a
        # plain `docker compose up -d` never starts it.
        #
        #   docker compose --profile watch up -d nodejs-watch
        #   docker compose --profile watch logs -f nodejs-watch
        #   docker compose --profile watch rm -sf nodejs-watch
        #
        # The symlink below is load-bearing: yarn classic COPIES the
        # "@vanssa/sylius-slider-plugin": "file:../../../assets" dependency, and
        # the Stimulus controllers resolve through that copy — so a naive
        # `yarn watch` silently ignores every controller edit. Linking the
        # package at the real assets/ tree puts them back under the watcher.
        image: node:${NODE_VERSION:-20}-alpine
        user: ${DOCKER_USER:-1000:1000}
        working_dir: /srv/sylius
        profiles: ["watch"]
        entrypoint: [ "/bin/sh","-c" ]
        environment:
            # Escape hatch: set WATCHPACK_POLLING=true if inotify misses events.
            WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
            CHOKIDAR_USEPOLLING: ${WATCHPACK_POLLING:-false}
        command:
            - |
                cd vendor/sylius/test-application
                LINK=node_modules/@vanssa/sylius-slider-plugin
                if [ ! -L "$$LINK" ]; then
                    yarn install --force
                    rm -rf "$$LINK"
                    ln -s /srv/sylius/assets "$$LINK"
                fi
                exec yarn watch
        volumes:
            - .:/srv/sylius:rw,cached
            - ./public:/srv/sylius/public:rw,delegated
    chrome:
        # Headless Chrome for the @javascript Behat leg (behat.yml's chrome
        # session points at http://chrome:9222). Restart it after an asset
        # rebuild — it keeps compiled bundles in memory.
        image: zenika/alpine-chrome:latest
        command:
            - --no-sandbox
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --remote-allow-origins=*
            - --window-size=1600,950
            - --hide-scrollbars
        shm_size: 2gb
        ports:
            - "9222:9222"
    playwright:
        # Playwright runner for tests/e2e (`make e2e`) and the docs-media
        # generators (`make docs-media`). Behind the "e2e" profile, so a plain
        # `docker compose up -d` never starts it.
        #
        #   docker compose --profile e2e up -d playwright
        #   docker compose --profile e2e exec -T playwright npx playwright test
        #   docker compose --profile e2e rm -sf playwright
        #
        # Declarative service + `exec`, never `docker compose run -d`: a `run`
        # with a never-exiting command leaks an orphan container per session
        # (the same failure mode that leaked 22 php-run containers via the old
        # mate MCP config).
        build:
            context: ./docker/playwright
        # network_mode: host is load-bearing, not a convenience. Every Sylius
        # channel in this project has hostname "localhost" and Sylius resolves
        # the channel from the request host — from inside the compose network
        # the app is reachable as http://nginx, which resolves to NO channel and
        # every shop page 404s. Host networking makes http://localhost hit the
        # published nginx port and the channel resolves. (Linux only; on
        # macOS/Windows swap this for `extra_hosts` + http://host.docker.internal.)
        network_mode: host
        working_dir: /srv/sylius
        user: ${DOCKER_USER:-1000:1000}
        profiles: ["e2e"]
        environment:
            BASE_URL: ${BASE_URL:-http://localhost}
        command: ["sleep", "infinity"]
        volumes:
            - .:/srv/sylius:rw,cached
    mailhog:
        ports:
            - "8025:8025"

volumes:
    mysql-data:
    public-media:
